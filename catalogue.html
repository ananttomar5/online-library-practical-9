<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Campus online library project">
  <title>Catalogue | PageTurn Library</title><link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="catalogue">
  <div id="siteHeader"></div>
  <main>
<section class="page-intro"><p class="eyebrow">THE COLLECTION</p><h1>Book catalogue</h1><p>Search by title or author, or choose a genre to narrow your list.</p></section>
<section class="section">
  <div class="filter-bar"><input id="bookSearch" type="search" placeholder="Search title or author..." aria-label="Search books"><select id="genreFilter" aria-label="Filter by genre"><option value="all">All genres</option><option>Fiction</option><option>Science</option><option>Technology</option><option>History</option><option>Self-help</option></select></div>
  <p id="catalogueCount" class="muted"></p><div id="catalogueBooks" class="book-grid"></div>
</section>
</main>
  <div id="siteFooter"></div>
</body>
</html>
